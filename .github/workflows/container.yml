name: Build and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: docker compose config -q
      - run: docker compose -f compose.build.yaml config -q
      - run: docker compose -p webhook-radar -f "https://github.com/${GITHUB_REPOSITORY}.git#main:compose.build.yaml" config -q
      - run: bash -n install.sh
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: node --test
      - name: Build image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker build --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" --build-arg BUILD_REVISION="$GITHUB_SHA" -t "$IMAGE" .
      - name: Verify bundled browser on existing read-only stacks
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,src="$PWD/.github/browser-smoke.mjs",dst=/app/browser-smoke.mjs,readonly \
            "$IMAGE" node /app/browser-smoke.mjs
      - name: Verify frontend flows in the read-only image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,src="$PWD/.github/ui-smoke.mjs",dst=/app/ui-smoke.mjs,readonly \
            "$IMAGE" node /app/ui-smoke.mjs
      - name: Verify Shadowsocks parameter entry and credential handling
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            -e UI_SMOKE_SCREENSHOT_DIR=/app/.data/shadowsocks-smoke-screenshots \
            --mount type=bind,src="$PWD/.github/shadowsocks-ui-smoke.mjs",dst=/app/shadowsocks-ui-smoke.mjs,readonly \
            "$IMAGE" node /app/shadowsocks-ui-smoke.mjs
      - name: Verify validated monitor creation and repair in the read-only image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            -e UI_SMOKE_SCREENSHOT_DIR=/app/.data/rule-smoke-screenshots \
            --mount type=bind,src="$PWD/.github/monitor-rule-ui-smoke.mjs",dst=/app/monitor-rule-ui-smoke.mjs,readonly \
            "$IMAGE" node /app/monitor-rule-ui-smoke.mjs
      - name: Verify AI-generated order workflows without real purchases
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            -e UI_SMOKE_SCREENSHOT_DIR=/app/.data/order-smoke-screenshots \
            --mount type=bind,src="$PWD/.github/orders-ui-smoke.mjs",dst=/app/orders-ui-smoke.mjs,readonly \
            "$IMAGE" node /app/orders-ui-smoke.mjs
      - name: Verify login redirects and restored sessions without purchases
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,src="$PWD/.github/order-login-smoke.mjs",dst=/app/order-login-smoke.mjs,readonly \
            "$IMAGE" node /app/order-login-smoke.mjs
      - name: Verify login and transaction resilience boundaries
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,src="$PWD/.github/order-resilience-smoke.mjs",dst=/app/order-resilience-smoke.mjs,readonly \
            "$IMAGE" node /app/order-resilience-smoke.mjs
      - name: Verify coupons and discounted one-shot orders
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,src="$PWD/.github/order-coupon-smoke.mjs",dst=/app/order-coupon-smoke.mjs,readonly \
            "$IMAGE" node /app/order-coupon-smoke.mjs
      - name: Verify browser, proxy and preview resource cleanup
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,src="$PWD/.github/resource-smoke.mjs",dst=/app/resource-smoke.mjs,readonly \
            "$IMAGE" node /app/resource-smoke.mjs
      - name: Verify encrypted Shadowsocks traffic and authenticated HTTPS ordering
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull ghcr.io/shadowsocks/ssserver-rust:v1.25.0
          SERVER_CONTAINER=$(docker create ghcr.io/shadowsocks/ssserver-rust:v1.25.0)
          trap 'docker rm -f "$SERVER_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker cp "$SERVER_CONTAINER:/usr/bin/ssserver" "$RUNNER_TEMP/ssserver-test"
          chmod 755 "$RUNNER_TEMP/ssserver-test"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,src="$PWD/.github/proxy-smoke.mjs",dst=/app/proxy-smoke.mjs,readonly \
            --mount type=bind,src="$PWD/.github/proxy-auth-smoke.mjs",dst=/app/proxy-auth-smoke.mjs,readonly \
            --mount type=bind,src="$RUNNER_TEMP/ssserver-test",dst=/app/ssserver-test,readonly \
            "$IMAGE" sh -c 'node /app/proxy-smoke.mjs && node /app/proxy-auth-smoke.mjs'
      - name: Verify read-only Linux load diagnostics and tmpfs
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --init --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            "$IMAGE" node --input-type=module -e "import assert from 'node:assert/strict'; import {collectDiagnostics} from './lib/diagnostics.js'; const report=await collectDiagnostics(); assert.equal(report.available,true); assert.equal(report.temporary.tmpfs,true); assert.ok(report.visibleProcesses.processes>0); console.log('Linux pressure, process and tmpfs diagnostics passed');"
      - name: Publish to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
