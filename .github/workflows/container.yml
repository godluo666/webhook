name: Build and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: docker compose config -q
      - run: docker compose -f compose.build.yaml config -q
      - run: docker compose -p webhook-radar -f "https://github.com/${GITHUB_REPOSITORY}.git#main:compose.build.yaml" config -q
      - run: bash -n install.sh
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: node --test
      - name: Build image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker build --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE" .
      - name: Verify bundled browser on existing read-only stacks
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,src="$PWD/.github/browser-smoke.mjs",dst=/app/browser-smoke.mjs,readonly \
            "$IMAGE" node /app/browser-smoke.mjs
      - name: Verify bundled Shadowsocks with real encrypted traffic
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull ghcr.io/shadowsocks/ssserver-rust:v1.25.0
          SERVER_CONTAINER=$(docker create ghcr.io/shadowsocks/ssserver-rust:v1.25.0)
          trap 'docker rm -f "$SERVER_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker cp "$SERVER_CONTAINER:/usr/bin/ssserver" "$RUNNER_TEMP/ssserver-test"
          chmod 755 "$RUNNER_TEMP/ssserver-test"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=bind,src="$PWD/.github/proxy-smoke.mjs",dst=/app/proxy-smoke.mjs,readonly \
            --mount type=bind,src="$RUNNER_TEMP/ssserver-test",dst=/app/ssserver-test,readonly \
            "$IMAGE" node /app/proxy-smoke.mjs
      - name: Publish to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
