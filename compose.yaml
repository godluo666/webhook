services:
  webhook-radar:
    image: ghcr.io/godluo666/webhook:latest
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RADAR_BIND:-127.0.0.1}:${RADAR_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/.data
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - "${RADAR_DATA_VOLUME:-radar_data}:/app/.data"

volumes:
  radar_data:
    name: webhook-radar_radar_data
